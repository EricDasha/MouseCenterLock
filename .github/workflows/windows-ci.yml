name: Windows CI

on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:

jobs:
  test-and-build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/input_backend

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Validate JSON assets
        run: python -c "import json, pathlib; [json.load(open(p, encoding='utf-8')) for p in pathlib.Path('i18n').glob('*.json')]; [json.load(open(p, encoding='utf-8')) for p in pathlib.Path('examples/mouse-macros').rglob('*.json')]; print('json ok')"

      - name: Rust input backend check
        working-directory: rust/input_backend
        run: cargo check

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Build smoke test
        run: python build.py --skip-test

      - name: Verify built executable
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath "dist/MouseControlLayer.exe")) {
            throw "Build output dist/MouseControlLayer.exe was not created."
          }
          if (-not (Test-Path -LiteralPath "native/mcl_input_backend.dll")) {
            throw "Rust backend native/mcl_input_backend.dll was not created."
          }
          if (-not (Test-Path -LiteralPath "native/mcl_input_backend.version")) {
            throw "Rust backend version marker was not created."
          }

      - name: Upload smoke-build artifact
        uses: actions/upload-artifact@v7
        with:
          name: MCL-windows-smoke
          path: |
            dist/MouseControlLayer.exe
            native/mcl_input_backend.version
